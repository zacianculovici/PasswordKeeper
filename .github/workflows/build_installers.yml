name: Build and Release Installers

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build-matrix:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed "src\MainPage.py" --name PasswordKeeper --add-data "src/assets;assets" --collect-all customtkinter

      - name: Build with PyInstaller (macOS and Linux)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed "src/MainPage.py" --name PasswordKeeper --add-data "src/assets:assets" --collect-all customtkinter

      # --- WINDOWS: Inno Setup Installer (.exe) ---
      - name: Update Version in Installer Script
        if: matrix.os == 'windows-latest'
        run: |
          # Strip the 'v' prefix from the tag (e.g. v1.0.0 -> 1.0.0)
          $VERSION = "${{ github.ref_name }}" -replace "^v", ""
          if ([string]::IsNullOrEmpty($VERSION)) { $VERSION = "1.0.0" }
          
          # Replace AppVersion and OutputBaseFilename inside PasswordKeeperInstaller.iss
          $filePath = "packaging/windows/PasswordKeeperInstaller.iss"
          $content = Get-Content $filePath -Raw
          $content = $content -replace "AppVersion=.*", "AppVersion=$VERSION"
          $content = $content -replace "OutputBaseFilename=.*", "OutputBaseFilename=PasswordKeeper-$VERSION-Windows-Setup"
          Set-Content $filePath $content

      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: packaging/windows/PasswordKeeperInstaller.iss

      # --- MACOS: DMG Installer (.dmg) ---
      - name: Build macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          # Extract version from tag (v1.1.0 -> 1.1.0), fallback if not tagged
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi

          brew install create-dmg
          create-dmg \
            --volname "PasswordKeeper Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "PasswordKeeper.app" 175 120 \
            --hide-extension "PasswordKeeper.app" \
            --app-drop-link 425 120 \
            "dist/PasswordKeeper-$VERSION-Universal.dmg" \
            "dist/PasswordKeeper.app"

      # --- LINUX: Tarball Archive (.tar.gz) ---
      - name: Build Linux Tarball
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Extract version from tag (v1.1.0 -> 1.1.0), fallback if not tagged
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi

          cd dist
          tar -czf PasswordKeeper-$VERSION-Linux-x86_64.tar.gz main/
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build-matrix
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download All Artifacts
        uses: actions/download-artifact@v5
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/*
          generate_release_notes: true

      - name: Update README with New Version
        run: |
          # Extract version from tag (e.g., v1.1.0 -> 1.1.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          
          # Use sed to replace placeholders in your README
          # Make sure your README has links containing something like PasswordKeeper-VERSION-Windows-Setup.exe
          sed -i "s/PasswordKeeper-.*-Windows-Setup.exe/PasswordKeeper-$VERSION-Windows-Setup.exe/g" README.md
          sed -i "s/PasswordKeeper-.*-Universal.dmg/PasswordKeeper-$VERSION-Universal.dmg/g" README.md
          sed -i "s/PasswordKeeper-.*-Linux-x86_64.tar.gz/PasswordKeeper-$VERSION-Linux-x86_64.tar.gz/g" README.md

          # Commit and push the updated README back to main
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Docs: update download links for $VERSION [skip ci]"
          git push origin HEAD:main
